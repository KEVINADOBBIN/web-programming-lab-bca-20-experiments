<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="ISO-8859-1" />
    <title>Input Type Demonstration</title>
</head>

<body>
    <form>
        Button:
        <input type="button" value="Button" />
        <br/><br/>

        Submit Button:
        <input type="submit" value="Submit" />
        <br/><br/>

        Reset Button:
        <input type="reset" value="Reset" />
        <br/><br/>

        Check Box:
        <input type="checkbox" />
        <br/><br/>

        Radio Button:
        <input type="radio" />
        <br/><br/>

        Text Box:
        <input type="text" />
        <br/><br/>

        Password:
        <input type="password" />
        <br/><br/>

        Text Area:
        <textarea rows="4" cols="30"></textarea>
        <br/><br/>

        File Upload:
        <input type="file" name="fileUpload" />
        <br/><br/>
    </form>
</body>
</html>
