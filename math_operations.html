<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="ISO-8859-1" />
    <title>Math Operations</title>

    <script type="text/javascript">
        var x, y, z;

        x = 50;
        y = 10;

        document.write("x = " + x + "<br/>");
        document.write("y = " + y + "<br/><br/>");

        // Addition
        z = x + y;
        document.write("x + y = " + z + "<br/>");

        // Subtraction
        z = x - y;
        document.write("x - y = " + z + "<br/>");

        // Multiplication
        z = x * y;
        document.write("x * y = " + z + "<br/>");

        // Division
        z = x / y;
        document.write("x / y = " + z + "<br/>");

        // Modulus
        z = x % y;
        document.write("x % y = " + z + "<br/>");
    </script>
</head>

<body>
</body>
</html>
