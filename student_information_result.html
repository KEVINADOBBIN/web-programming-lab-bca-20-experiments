<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="ISO-8859-1" />
    <title>Student Information Result</title>
    <script type="text/javascript">
        function showResults() {
            // Get student details
            var name = document.getElementById("name").value;
            var cls = document.getElementById("class").value;

            // Get marks and convert to integers
            var sub1 = parseInt(document.getElementById("sub1").value) || 0;
            var sub2 = parseInt(document.getElementById("sub2").value) || 0;
            var sub3 = parseInt(document.getElementById("sub3").value) || 0;

            // Calculate total and average
            var total = sub1 + sub2 + sub3;
            var avg = total / 3;

            // Determine grade and result
            var grade = "";
            var result = "";

            if (avg >= 60) {
                grade = "A";
                result = "First Class";
            } else if (avg >= 50) {
                grade = "B";
                result = "Second Class";
            } else if (avg >= 40) {
                grade = "C";
                result = "Third Class";
            } else {
                grade = "D";
                result = "Fail";
            }

            // Display results
            var output = "<h2>Results</h2>" +
                         "<b>Name:</b> " + name + "<br/><br/>" +
                         "<b>Class:</b> " + cls + "<br/><br/>" +
                         "<b>Total Marks:</b> " + total + "<br/><br/>" +
                         "<b>Average:</b> " + avg.toFixed(2) + "<br/><br/>" +
                         "<b>Grade:</b> " + grade + "<br/><br/>" +
                         "<b>Result:</b> " + result + "<br/><br/>";

            document.getElementById("results").innerHTML = output;
        }
    </script>
</head>
<body>
    <form>
        <table border="1" cellpadding="5" cellspacing="0">
            <tr>
                <th colspan="2">Student Details</th>
            </tr>
            <tr>
                <td>Student Name:</td>
                <td><input type="text" id="name" /></td>
            </tr>
            <tr>
                <td>Class:</td>
                <td><input type="text" id="class" /></td>
            </tr>
            <tr>
                <td>Subject 1 Marks:</td>
                <td><input type="text" id="sub1" /></td>
            </tr>
            <tr>
                <td>Subject 2 Marks:</td>
                <td><input type="text" id="sub2" /></td>
            </tr>
            <tr>
                <td>Subject 3 Marks:</td>
                <td><input type="text" id="sub3" /></td>
            </tr>
        </table>
        <br/>
        <input type="button" value="Show Results" onclick="showResults()" />
    </form>

    <div id="results" style="margin-top:20px;"></div>
</body>
</html>
