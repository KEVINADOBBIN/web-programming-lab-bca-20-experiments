<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="ISO-8859-1" />
    <title>List Style Types</title>

    <style type="text/css">
        ol.first {
            list-style-type: decimal;
        }

        ol.second {
            list-style-type: decimal-leading-zero;
        }

        ol.third {
            list-style-type: lower-roman;
        }

        ol.fourth {
            list-style-type: upper-roman;
        }
    </style>
</head>

<body>
    <h2>List Style Types Demonstration</h2>

    <h3>Decimal</h3>
    <ol class="first">
        <li>Item 1</li>
        <li>Item 2</li>
    </ol>

    <h3>Decimal Leading Zero</h3>
    <ol class="second">
        <li>Item 1</li>
        <li>Item 2</li>
    </ol>

    <h3>Lower Roman</h3>
    <ol class="third">
        <li>Item 1</li>
        <li>Item 2</li>
    </ol>

    <h3>Upper Roman</h3>
    <ol class="fourth">
        <li>Item 1</li>
        <li>Item 2</li>
    </ol>
</body>
</html>
