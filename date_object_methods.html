<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="ISO-8859-1" />
    <title>Date Object Demo</title>

    <script type="text/javascript">
        var dateObj = new Date();

        document.write("Current Date: " + dateObj.toString() + "<br/><br/>");
        document.write("getSeconds(): " + dateObj.getSeconds() + "<br/>");
        document.write("getMinutes(): " + dateObj.getMinutes() + "<br/>");
        document.write("getHours(): " + dateObj.getHours() + "<br/>");
        document.write("getDate(): " + dateObj.getDate() + "<br/>");
        document.write("getDay(): " + dateObj.getDay() + "<br/>");
        document.write("getMonth(): " + dateObj.getMonth() + "<br/>");
        document.write("getFullYear(): " + dateObj.getFullYear() + "<br/>");
        document.write("getTime(): " + dateObj.getTime() + "<br/>");
    </script>
</head>

<body>
</body>
</html>
