<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="ISO-8859-1" />
    <title>Div Tag Example</title>

    <style type="text/css">
        .menu {
            background-color: orange;
            text-align: right;
            padding: 10px;
        }

        .menu a {
            margin-left: 15px;
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        .main {
            border: 1px solid black;
            text-align: left;
            padding: 15px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="menu">
        <a href="#">HOME</a>
        <a href="#">CONTACT</a>
        <a href="#">ABOUT</a>
    </div>

    <div class="main">
        <h3>Content Article</h3>
        <p>This paragraph contains the contents of the article.</p>
    </div>
</body>
</html>
