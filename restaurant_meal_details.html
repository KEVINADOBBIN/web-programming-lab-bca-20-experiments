<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="ISO-8859-1" />
    <title>Restaurant Meal Details</title>

    <script type="text/javascript">
        function findCost() {
            var major = document.getElementById("major");
            var starters = document.getElementById("starters");
            var soft = document.getElementById("soft");
            var textarea = document.getElementById("orderedItems");

            var selectedItems = "Item\t\t\tPrice\n";
            var totalCost = 0;

            // Major Dishes
            for (var i = 0; i < major.options.length; i++) {
                if (major.options[i].selected) {
                    var price = parseInt(major.options[i].value);
                    totalCost += price;
                    selectedItems += major.options[i].text + "\t\t" + price + "\n";
                }
            }

            // Starters
            for (var i = 0; i < starters.options.length; i++) {
                if (starters.options[i].selected) {
                    var price = parseInt(starters.options[i].value);
                    totalCost += price;
                    selectedItems += starters.options[i].text + "\t\t" + price + "\n";
                }
            }

            // Soft Drinks (Single choice)
            var softIndex = soft.selectedIndex;
            if (softIndex != -1) {
                var price = parseInt(soft.options[softIndex].value);
                totalCost += price;
                selectedItems += soft.options[softIndex].text + "\t\t" + price + "\n";
            }

            selectedItems += "\nTotal Cost\t\t" + totalCost;
            textarea.value = selectedItems;
        }
    </script>
</head>

<body>
    <form name="menuForm">
        <table border="2" cellpadding="5" cellspacing="0">
            <tr>
                <th colspan="2"><h2>Restaurant Meal Details</h2></th>
            </tr>

            <tr>
                <td>Major Dishes</td>
                <td>
                    <select id="major" multiple size="3">
                        <option value="100">Vegetable Pulav</option>
                        <option value="150">Hyderabad Biriyani</option>
                        <option value="50">Roti with Curry</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Starters</td>
                <td>
                    <select id="starters" multiple size="3">
                        <option value="80">Gobi Manchurian</option>
                        <option value="40">Veg Clear Soup</option>
                        <option value="30">Masala Papad</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Soft Drinks</td>
                <td>
                    <select id="soft">
                        <option value="20">Pepsi</option>
                        <option value="20">Coke</option>
                        <option value="30">Lime Soda</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <textarea id="orderedItems" rows="10" cols="40"></textarea>
                </td>
            </tr>

            <tr>
                <td align="center">
                    <input type="button" value="Find Total Cost" onclick="findCost()" />
                </td>
                <td align="center">
                    <input type="reset" value="Clear" onclick="document.getElementById('orderedItems').value=''" />
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
